name: Python package CI

on:
  pull_request:
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  package:
    name: Lint, test, and build Python package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          cache: true
          locked: true

      - name: Lint and type-check
        run: pixi run check

      - name: Test
        run: pixi run test

      - name: Build wheel
        run: pixi run python -m pip wheel --no-deps . -w dist

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preface-python-wheel
          path: dist/*.whl
          retention-days: 3

  image:
    name: Build and publish Python image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # Login before build so registry BuildKit cache can be read/written (avoids Actions storage).
      - name: Log in to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: "."
          file: Dockerfile
          load: true
          tags: preface:${{ github.sha }}
          cache-from: type=registry,ref=quay.io/cmgg/preface:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=quay.io/cmgg/preface:buildcache,mode=max' || '' }}

      - name: Publish Docker tags
        if: github.event_name != 'pull_request'
        env:
          IMAGE: quay.io/cmgg/preface
        run: |
          tags=("$IMAGE:${{ github.sha }}")
          if [[ "${{ github.event_name }}" == "release" ]]; then
            package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
            tags+=("$IMAGE:${package_version}" "$IMAGE:stable")
          else
            tags+=("$IMAGE:latest")
          fi
          for tag in "${tags[@]}"; do
            docker tag "preface:${{ github.sha }}" "$tag"
            docker push "$tag"
          done

      - name: Clean up artifacts
        if: github.event_name != 'pull_request'
        uses: geekyeggo/delete-artifact@v6
        with:
          name: preface-python-wheel
          failOnError: false
